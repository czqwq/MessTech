name: Auto Close Completed Issues

on:
  schedule:
    # 每小时的第 15 分钟运行一次，避开整点高峰
    - cron: '15 * * * *'
  workflow_dispatch: # 允许手动触发，方便测试

jobs:
  close-completed-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Auto close issues labeled Complete with no comments for 24h
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'Complete';
            const hoursToWait = 24;
            const now = new Date();
            const cutoff = new Date(now.getTime() - hoursToWait * 60 * 60 * 1000);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labelName,
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              });

              let labeledEvent = null;
              for (const event of events) {
                if (
                  event.event === 'labeled' &&
                  event.label &&
                  event.label.name === labelName
                ) {
                  if (
                    !labeledEvent ||
                    new Date(event.created_at) > new Date(labeledEvent.created_at)
                  ) {
                    labeledEvent = event;
                  }
                }
              }

              if (!labeledEvent) continue;

              const labeledAt = new Date(labeledEvent.created_at);

              if (labeledAt > cutoff) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                since: labeledEvent.created_at,
                per_page: 100
              });

              const humanComments = comments.filter(c => c.user.type !== 'Bot');
              if (humanComments.length > 0) {
                continue;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'This issue has been automatically closed as **completed** because it was labeled `Complete` more than 24 hours ago and no comments were added since.'
              });

              console.log(`Closed issue #${issue.number}`);
            }
