dependencies {
    elytraModpackVersion {
        // 在这配置的gtnh版本 用于自动拉取依赖版本
        gtnhVersion = "2.9.0"
        // 是否不缓存拉取的依赖清单文件
        manifestNoCache = false
        // 是否自动为输出的jar添加 `gtnhVersion` 后缀
        attachManifestVersionToJar = false
    }
    implementation(gtnhDev("GT5-Unofficial"))
    implementation(gtnhDev("Applied-Energistics-2-Unofficial"))
    implementation(gtnhDev("NewHorizonsCoreMod"))
    implementation(gtnhDev("NotEnoughEnergistics"))
    implementation(gtnhDev("ForestryMC"))
    implementation(gtnhDev("Infernal-Mobs"))
    implementation(files("libs/etfuturum-2.6.65-GTNH-dev.jar"))
    implementation("com.cubefury.vendingmachine:VendingMachine:0.4.82:dev")
    implementation(gtnhDev("Galaxy-Space-GTNH"))
    implementation(gtnhDev("SGCraft"))
    implementation(gtnhDev("twilightforest"))
    implementation(gtnhDev("SpiceOfLife"))
    implementation(gtnhDev("AppleCore"))
    implementation(gtnhDev("Avaritia"))
    runtimeOnlyNonPublishable(gtnhDev("Avaritiaddons"))
    runtimeOnlyNonPublishable(gtnhDev("neiaddons"))
    implementation(gtnhDev("Binnie"))
    implementation(gtnhDev("BloodMagic"))
    implementation(gtnhDev("Botania"))
    implementation(gtnhDev("Draconic-Evolution"))
    implementation(gtnhDev("EnderIO"))
    implementation(gtnhDev("Eternal-Singularity"))
    implementation(gtnhDev("supersolarpanels"))
    implementation(rfg.deobf('curse.maven:advsolar-362768:2885953'))
    implementation ("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")
    compileOnlyApi(gtnhDev("AspectRecipeIndex"))

    implementation(deobfCurse('witchery-69673:2234410'))
    implementation(gtnhDev("WitcheryExtras"))

    // TC API for the essentia machines and the Thaumonomicon research; present at runtime through the line below.
    compileOnly("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev") { transitive = false }
    // ThE API for the ME essentia input hatch (AE2 itself is a full dependency above); runtime through the line below.
    compileOnly(gtnhDev("ThaumicEnergistics")) { transitive = false }

    // Optional client integrations of the text effects: the font batch bridge and the NEI input field are only mixed in
    // when the mod is present, so they are compile-time only here and the pack supplies them at runtime.
    compileOnly(gtnhDev("Angelica")) { transitive = false }
    compileOnly(gtnhDev("NotEnoughItems")) { transitive = false }

    //runtime
    runtimeOnlyNonPublishable(gtnhDev("Angelica"))
    runtimeOnlyNonPublishable(gtnhDev("NotEnoughItems"))
    runtimeOnlyNonPublishable(gtnhDev("OpenComputers"))
    runtimeOnlyNonPublishable rfg.deobf(files("libs/spark.jar"))
    runtimeOnlyNonPublishable rfg.deobf(files("libs/OmniOcularUnofficial.jar"))
    runtimeOnlyNonPublishable(gtnhDev("ThaumicEnergistics"))
    runtimeOnlyNonPublishable(gtnhDev("OpenBlocks"))
    runtimeOnlyNonPublishable(gtnhDev("Universal-Singularities"))
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:BiomesOPlenty-220318:2499612"))
    runtimeOnlyNonPublishable(gtnhDev("MagicBees"))
    runtimeOnlyNonPublishable(gtnhDev("AspectRecipeIndex"))
    runtimeOnlyNonPublishable("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Chisel:2.17.33-GTNH:dev")
    runtimeOnlyNonPublishable(gtnhDev("StructureLib"))
    runtimeOnlyNonPublishable(gtnhDev("BlockRenderer6343")) { transitive = false }
    //extra mods
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:worldedit-gtnh:v0.0.8:dev")

    annotationProcessor('com.google.auto.value:auto-value:1.10.1')
    implementation('com.google.auto.value:auto-value-annotations:1.10.1')


    // jvmDowngrader
    compileOnly("javax.xml.bind:jaxb-api:2.3.1")
    compileOnly("org.jetbrains:annotations:26.0.1")
    compileOnly("org.projectlombok:lombok:1.18.46") { transitive = false }
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    configurations.configureEach {
        exclude group: 'com.github.GTNewHorizons', module: 'Baubles'
    }

    configurations.all {
        resolutionStrategy {
            force "com.github.GTNewHorizons:GTNHLib:0.11.54"
        }
    }
}


@SuppressWarnings('GrMethodMayBeStatic')
String gtnhDev(String name, String classifier = "dev") {
    return elytraModpackVersion.gtnh(name, classifier)
}
